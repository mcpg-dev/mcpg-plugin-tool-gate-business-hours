[package]
name = "mcpg-plugin-tool-gate-business-hours"
version = "0.1.0-alpha.18"
license = "Apache-2.0"
edition = "2024"
description = """
Business-hours / time-window ToolGate plugin for mcpg. Allows tool calls only
inside operator-configured weekly time windows (in a chosen IANA timezone),
with blackout dates always denied. A pre-dispatch control: pure time logic, no
I/O. Fails closed on bad config (refuses to load).
"""

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
cdylib-export = []
static-firstparty = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
mcpg-plugin-sdk      = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16", features = ["static-firstparty"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust date/time + IANA tz DB. default-features OFF (drops legacy oldtime);
# `clock` gives Utc::now(), `std` gives Tz: FromStr. No C deps, no TLS.
chrono    = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
